name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user or research problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the behavior or workflow you have in mind.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and risks
      description: How should correctness, provenance, and limitations be evaluated?
    validations:
      required: false
